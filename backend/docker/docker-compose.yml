version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db

    env_file:
      - ../.env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Nguyenthongoc123@
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

      - ./init.sql:/var/opt/mssql/backup/init.sql
    command: /bin/bash -c '/opt/mssql/bin/sqlservr & sleep 45 && /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Nguyenthongoc123@" -i /var/opt/mssql/backup/init.sql && wait'

volumes:
  sqlserver_data:
# hướng dẫn sử dụng đây nha mấy má công đen:
# chạy container:
#   - docker-compose up -d
# kiểm tra container:
#   - docker ps
# kiểm tra logs:
#   - docker logs sqlserver_db
# dừng container:
#   - docker-compose down