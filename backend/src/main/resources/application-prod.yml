server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: true
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 240000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
open:
  api:
    title: API Quản lý Đào tạo
    description: Tài liệu API cho dự án hệ thống Quản lý Đào tạo
    version: 1.0.0
    serverName: Local Server
    serverUrl: http://localhost:${server.port}

