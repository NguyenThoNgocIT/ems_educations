spring:
  datasource:
    url: jdbc:mysql://localhost:3306/emslms_db
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # hoặc create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

application:
  security:
    jwt:
      secret-key: mySecretKeyForJwtTokenGenerationWhichShouldBeAtLeast256BitsLongForSecurity123456789
      expiration: 86400000
      refresh-token:
        expiration: 604800000
