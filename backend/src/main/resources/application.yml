spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UniversityManagement;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Nguyenthongoc123@}
    driver-class-name: ${DB_DRIVER:}
  jpa:
    database-platform: ${DB_DIALECT:}
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        connection:
          characterEncoding: UTF-8
          useUnicode: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: ALWAYS

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration-postgresql
