name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        id: deploy
        run: |
          railway link $PROJECT_ID
          railway environment create pr-$PR_NUMBER 2>/dev/null || true
          railway up --environment pr-$PR_NUMBER --detach
      - name: Update PR comment with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://your-service-pr-${{ env.PR_NUMBER }}.up.railway.app`;
            // ... code để comment link lên PR

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Delete Preview Environment
        run: |
          railway link $PROJECT_ID
          railway environment delete pr-$PR_NUMBER --yes