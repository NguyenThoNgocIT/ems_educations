name = "education_mona"
main = ".open-next/worker.js" 
compatibility_date = "2026-01-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTJS_ENV = "production"

[observability]
enabled = true

# THÊM ĐOẠN NÀY: Ép Wrangler build theo định dạng ESM
[build]
command = "npm run build:cf"
[build.upload]
format = "modules"